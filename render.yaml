# Render Blueprint — connect this repo, then set ANTHROPIC_API_KEY in the dashboard.
# One-click: https://render.com/deploy?repo=https://github.com/basu8463/gridflow-agent
services:
  - type: web
    name: gridflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
